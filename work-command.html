<h2>AI 업무명령 · 규칙 기반</h2>
<p>AI API 사용료 없이 정해진 문장을 분석합니다. 현재는 조회와 미리보기만 제공하며 수금 내역을 저장하지 않습니다.</p>
<form id="command-form">
<label for="command">업무명령</label>
<input id="command" maxlength="300" autocomplete="off" placeholder="오늘 연경 30만원 이체 수금" aria-describedby="command-help" required>
<p id="command-help">예: 오늘 연경 30만원 이체 수금 / 2026-10-28 연경 300,000원 현금 수금 / 거래처 연경 조회<br>날짜 생략 시 한국 시간 기준 오늘을 적용합니다. 거래처는 조회 결과에서 직접 선택합니다.</p>
<button type="submit">분석·조회</button>
</form>
<div id="command-result" role="status" aria-live="polite"></div>
</main>
