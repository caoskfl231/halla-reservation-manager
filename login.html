<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>할라 장부 로그인</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#172231;font-family:system-ui,sans-serif;min-height:100dvh;display:grid;place-items:center;padding:24px}
    main{width:100%;max-width:420px;background:white;padding:32px 26px;border-radius:20px;box-shadow:0 12px 40px #18243714}
    h1{font-size:27px;margin:0 0 10px}p{color:#566274;line-height:1.6}label{display:block;font-weight:650;margin:20px 0 8px}
    input,button{width:100%;min-height:50px;border-radius:10px;font:inherit;font-size:17px}input{border:1px solid #b7c1cc;padding:12px}button{margin-top:24px;border:0;background:#153a60;color:white;font-weight:700;cursor:pointer}button:disabled{opacity:.55}
    #error{color:#af2424;min-height:24px;margin:16px 0 0;white-space:pre-line}small{display:block;color:#697586;margin-top:20px;line-height:1.6}[hidden]{display:none!important}
  </style>
</head>
<body><main>
  <h1>할라 장부 관리</h1>
  <p>로그인하면 함께 사용하는 장부를<br>조회하고 입력·수정할 수 있습니다.</p>
  <form id="login-form">
    <label for="email">아이디 (이메일)</label><input id="email" type="email" autocomplete="username" required autofocus>
    <label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" required>
    <button id="login-button" type="submit">로그인</button>
  </form>
  <form id="mfa-form" hidden>
    <label for="mfa-code">2단계 인증번호</label><input id="mfa-code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required>
    <p>인증 앱에 표시된 6자리 번호를 입력해 주세요.</p>
    <button id="mfa-button" type="submit">인증하고 장부 열기</button>
  </form>
  <p id="error" role="alert" aria-live="polite"></p>
  <small>관리자가 허용한 계정만 이용할 수 있습니다.<br>비밀번호는 장부에 저장되지 않습니다.</small>
  <script type="module" src="js/ledger-login.js"></script>
</main></body></html>
