<header class="page-heading"><h1>식당 매출내역</h1><button id="add" disabled>+ 매출 등록</button></header>
<section class="sales-totals" aria-label="조회 기간 매출 합계"><div class="metric"><span>총매출</span><strong id="total-gross">—</strong></div><div class="metric"><span>부가세 (10%)</span><strong id="total-vat">—</strong></div><div class="metric"><span>카드수수료</span><strong id="total-fee">—</strong></div><div class="metric net"><span>실매출액</span><strong id="total-net">—</strong></div></section>
<section class="filter-panel"><form id="filters" class="filters"><label>시작일<input id="from" type="date" required></label><label>종료일<input id="to" type="date" required></label><button>조회</button><button id="refresh" type="button">새로고침</button></form></section>
<div class="list-meta"><span>조회 건수 <strong id="count">—</strong></span><p id="status" role="status">매출내역을 불러오는 중입니다.</p></div><section id="rows"></section><p id="empty" hidden>조회 기간에 등록된 매출내역이 없습니다.</p>
<p class="note">부가세 포함 매출 기준 · 부가세 = 매출액 ÷ 11 · 카드수수료 = 카드매출 × 수수료율<br>실매출액 = 총매출 − 부가세 − 카드수수료 (원 단위 반올림)<br>실매출액은 매입비·인건비 등 지출을 빼기 전 금액입니다.</p></main>
<dialog data-save-dialog id="editor" aria-labelledby="editor-title"><form id="entry"><div class="save-dialog-content"><h2 id="editor-title" tabindex="-1" autofocus>매출 등록</h2><div class="editor-grid">
<label>날짜<input id="entry-date" type="date" required></label><label>결제수단<select id="entry-payment"><option>카드</option><option>현금</option><option>계좌이체</option></select></label>
<label>매출액 (부가세 포함, 원)<input id="entry-amount" type="number" inputmode="numeric" required min="1" max="999999999999" step="1"></label>
<label>카드수수료 (%)<input id="entry-rate" type="number" inputmode="decimal" required min="0" max="100" step="0.01" value="3"></label>
<label class="wide">메모<textarea id="entry-memo" rows="2" maxlength="1000"></textarea></label></div>
<div class="preview" aria-live="polite"><div><span>부가세 (10%)</span><strong id="preview-vat">0원</strong></div><div><span>카드수수료</span><strong id="preview-fee">0원</strong></div><div class="net"><span>실매출액</span><strong id="preview-net">0원</strong></div></div>
<p id="entry-error" role="alert"></p></div><div class="actions save-dialog-actions"><button id="save">저장</button><button id="remove" type="button" hidden>삭제</button><button id="cancel" type="button">취소</button></div></form></dialog>
