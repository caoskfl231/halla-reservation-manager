<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>식당 판매가 · 마진 계산</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f6;color:#16352b;font:16px system-ui,sans-serif}main{max-width:900px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center}a{color:#08764e}h1{font-size:28px}h2{font-size:20px;margin:0 0 18px}section{background:white;border:1px solid #d8e2dd;border-radius:16px;padding:22px;margin:18px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:grid;gap:8px;font-size:14px}input,select,button{font:inherit;border:1px solid #baccc2;border-radius:8px;padding:12px;width:100%;min-width:0}button{cursor:pointer;background:#08764e;color:white}button:disabled{opacity:.5}p,small{color:#586c62;line-height:1.6}.result{background:#e9f7ef}dl{display:grid;grid-template-columns:1fr 1fr;gap:14px}dd{text-align:right;margin:0;font-weight:bold}#message{color:#a22}#result{font-size:19px}.actions{display:flex;gap:12px}.saved{display:flex;gap:12px;margin-top:10px}.saved button:first-child{text-align:left} @media(max-width:500px){main{padding:12px}section{padding:16px}.grid{gap:12px}h1{font-size:23px}}
</style><main><header><a href="index.html">할라 장부표</a><a href="item-manage.html">품목 관리</a></header><h1>식당 판매가 · 마진 계산</h1>
<form id="form"><section><h2>상품 및 메뉴 정보</h2><button type="button" id="load">장부에서 불러오기</button><p id="source" role="status">장부 품목을 불러오거나 직접 입력하세요.</p><div class="grid">
<label>품목 구분<select id="group"><option value="">전체</option></select></label><label>장부 품목 선택<select id="item"><option value="">직접 입력</option></select></label>
<label>품명<input id="name"></label><label>메뉴명<input id="menu" required></label>
<label>매입단가 (원)<input id="cost" type="number" min="0" step="any" value="0" required></label><label>매입 단위<select id="unit"><option value="kg">kg</option><option value="g">g</option><option value="other">개 · 봉 · 박스</option></select></label>
<label>매입 1단위의 중량 (g)<input id="base" type="number" min="0.001" step="any" value="1000" required></label><label>1인분 판매중량 (g)<input id="weight" type="number" min="0.001" step="any" value="150" required></label>
<label>감량률 (%)<input id="loss" type="number" min="0" max="99.99" step="any" value="10" required></label></div><small>박스·낱개는 매입 1단위의 중량을 입력하세요.</small></section>
<section><h2>1인분 추가 재료비</h2><div class="grid">
<label>반찬 · 야채 (원)<input id="side" type="number" min="0" step="any" value="0" required></label><label>소스 · 양념 (원)<input id="sauce" type="number" min="0" step="any" value="0" required></label><label>기타 재료 (원)<input id="other" type="number" min="0" step="any" value="0" required></label><label>카드수수료율 (%)<input id="fee" type="number" min="0" max="99.99" step="any" value="0" required></label></div><small>카드수수료는 판매가 전액에 적용합니다.</small></section>
<section><h2>판매가 ↔ 마진율 자동 계산</h2><div class="grid"><label>목표 / 실제 마진율 (%)<input id="margin" type="number" step="any" value="60" required></label><label>판매가격 (원)<input id="price" type="number" min="0.01" step="any" required></label></div><p id="mode">마진율 기준으로 판매가를 계산합니다.</p><small>마지막으로 수정한 판매가 또는 마진율을 유지하며 재료비 변경을 반영합니다.</small></section>
<section class="result"><h2>계산 결과</h2><div id="result" aria-live="polite"></div><p id="message" role="alert"></p><small>원 단위 반올림 · 인건비·월세·세금 차감 전</small></section><div class="actions"><button type="reset">초기화</button><button type="submit">메뉴 저장</button></div></form><section><h2>저장한 메뉴</h2><p>이 기기·브라우저에 저장됩니다. 다른 기기와 자동 공유되지 않습니다.</p><div id="saved"></div></section></main><script type="module" src="js/restaurant-margin.js"></script></html>
