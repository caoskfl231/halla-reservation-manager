<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>할라축산 옵션선택 임시 미리보기</title>
<style>*{box-sizing:border-box}body{margin:0;background:#e9eeec;color:#20352b;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}.top{height:65px;background:#153c2f;color:white;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700}.shade{padding:18px 12px}.modal{background:white;border-radius:22px;max-width:560px;margin:auto;box-shadow:0 10px 40px #243e3420;overflow:hidden}.header{padding:20px 18px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px}.header strong{font-size:22px}.back{border:0;border-radius:12px;background:#edf2f6;color:#2773d9;font-size:14px;font-weight:700;padding:12px}.notice{font-size:12px;color:#697888;padding:0 18px 14px;border-bottom:1px solid #eee}.option{padding:15px 18px 11px;border-bottom:1px solid #e3e8eb}.name{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.name b{font-size:17px}.info{color:#6b7789;font-size:13px}.action{display:flex;align-items:center;justify-content:space-between;margin-top:10px}.stepper{display:flex;align-items:center;gap:12px}.stepper button{width:43px;height:41px;background:white;border:1px solid #cbd4df;border-radius:12px;font-size:24px;font-weight:600;color:#132845}.count{font-size:17px;font-weight:bold;min-width:15px;text-align:center}.status{font-size:13px;color:#6e7887}.footer{background:white;padding:16px 18px 20px;position:sticky;bottom:0;border-top:1px solid #eee}.totals{display:flex;justify-content:space-between;gap:10px;align-items:center}.amount{color:#c93d2b;font-size:21px;font-weight:800;margin:10px 0}.add{width:100%;border:0;border-radius:13px;background:#163e31;color:white;padding:16px;font-size:17px;font-weight:700}.add:disabled{background:#cbd3df;color:#657186}.small{font-size:12px;color:#617083;text-align:center;padding:14px} @media(max-width:360px){.header strong{font-size:19px}.info{font-size:12px}.option{padding:12px 14px}} </style></head>
<body><div class="top">할라축산 · 손님 화면 미리보기</div><div class="shade"><section class="modal"><div class="header"><strong>한돈 앞다리 · 옵션 선택</strong><button class="back" onclick="alert('임시 미리보기 화면입니다.')">← 상품보기</button></div><div class="notice">같은 상품을 추가하면 자동 할인됩니다. 실제 주문은 접수되지 않습니다.</div><div id="options"></div><div class="footer"><div class="totals"><span>선택 수량 <b id="qty">0</b>개</span><span class="status">옵션 3종</span></div><div class="amount">최종금액 <span id="total">0</span>원</div><button id="add" class="add" disabled onclick="alert('미리보기입니다. 실제 장바구니에 담기지 않습니다.')">옵션 수량을 선택해 주세요</button></div></section><div class="small">임시 디자인 테스트 · 운영 주문 및 재고와 연결되지 않음</div></div>
<script>const names=['제육용','찌개용','불고기용'];const counts=[0,0,0];const fmt=v=>v.toLocaleString('ko-KR');function render(){document.querySelector('#options').innerHTML=names.map((n,i)=>'<div class="option"><div class="name"><b>'+n+'</b><span class="info">300g · 국내산 · 1개 정상가 4,500원</span></div><div class="action"><div class="stepper"><button aria-label="'+n+' 수량 감소" onclick="change('+i+',-1)">−</button><span class="count">'+counts[i]+'</span><button aria-label="'+n+' 수량 증가" onclick="change('+i+',1)">+</button></div><span class="status">'+(counts[i]?'선택금액 '+fmt(counts[i]*4500)+'원':'선택 전')+'</span></div></div>').join('');const qty=counts.reduce((a,b)=>a+b,0);document.querySelector('#qty').textContent=qty;document.querySelector('#total').textContent=fmt(qty*4500);const b=document.querySelector('#add');b.disabled=!qty;b.textContent=qty?'담기 (미리보기 전용)':'옵션 수량을 선택해 주세요'}function change(i,d){counts[i]=Math.max(0,counts[i]+d);render()}render();</script></body></html>
